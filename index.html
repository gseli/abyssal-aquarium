<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Acuario Abisal — criaturas reales & ficticias</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="sea"></canvas>

<!-- capas de atmósfera -->
<div class="vignette" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<!-- HUD superior -->
<header class="hud">
  <button id="menuBtn" aria-label="Abrir bitácora">☰&nbsp;BITÁCORA</button>
  <div class="title-block">
    <h1>ACUARIO <em>ABISAL</em></h1>
    <p class="subtitle">CRIATURAS REALES&nbsp;·&nbsp;&amp;&nbsp;·&nbsp;FICTICIAS</p>
  </div>
  <div class="depth-block">
    <span class="depth-label">PROFUNDIDAD</span>
    <span id="depth">−38,0 m</span>
  </div>
</header>

<!-- panel bitácora -->
<aside id="panel" aria-hidden="true">
  <div class="panel-head">
    <h2>Bitácora de expedición</h2>
    <button id="panelClose" aria-label="Cerrar panel">×</button>
  </div>
  <div id="panelBody"><!-- generado por JS --></div>
  <div class="panel-foot">
    <span id="pop">—</span>
    <span class="ver">EXPEDICIÓN Nº7 · v0.1</span>
  </div>
</aside>

<!-- ficha de criatura (globo de diálogo) -->
<div id="card" hidden>
  <div class="card-head">
    <span id="cardBadge" class="badge">REAL</span>
    <button id="cardClose" aria-label="Cerrar ficha">×</button>
  </div>
  <h2 id="cardName">—</h2>
  <p id="cardSci" class="sci">—</p>
  <p id="cardFact" class="fact">—</p>
  <div class="stats">
    <div><label>TAMAÑO</label><span id="statTam">—</span></div>
    <div><label>PROFUNDIDAD</label><span id="statProf">—</span></div>
    <div><label>DIETA</label><span id="statDieta">—</span></div>
  </div>
</div>

<!-- pista inicial -->
<div id="hint">Toca una criatura para conocerla&nbsp;&nbsp;·&nbsp;&nbsp;toca el agua para dar de comer</div>

<noscript><p class="noscript">Este acuario necesita JavaScript para llenarse de agua.</p></noscript>

<script src="creatures.js"></script>
<script src="aquarium.js"></script>
</body>
</html>
